apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-backend-wit2024
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot
  template:
    metadata:
      labels:
        app: springboot
    spec:
      imagePullSecrets:
        - name: db-credentials
      containers:
        - name: springboot
          image: rhodgar14/my-backend-wit2024:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "test"
            - name: SPRING_PORT
              value: "32000"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://my-db-wit2024:5432/postgres"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials  # Name of the secret
                  key: SPRING_DATASOURCE_USERNAME  # Key for the username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials  # Name of the secret
                  key: SPRING_DATASOURCE_PASSWORD  # Key for the password
          ports:
            - containerPort: 32000